# Install scripts are denied explicitly (docs/decisions/D10).
# esbuild: postinstall only verifies its platform binary, which pnpm already installs as an optional dependency.
# lefthook: postinstall runs `lefthook install`; the `prepare` script does that instead.
# core-js (a posthog-js dependency, D77): postinstall only prints a funding banner; posthog-js ships its own bundle.
# tesseract.js: postinstall only prints an opencollective donation notice (`|| true`) (D74).
allowBuilds:
  "@posthog/cli": false
  core-js: false
  esbuild: false
  lefthook: false
  tesseract.js: false

# A high audit finding with no patched version, reached only through dev tooling: a dated exception, not
# a silent --omit (docs/decisions/D112). Remove the entry when picomatch ships a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
