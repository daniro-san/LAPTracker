# Pre-commit gates (plan §11.4). The secrets scan is the reason this hook exists: the repo is public.
# No pre-push hook: CI runs `pnpm check`, and the Claude Code Stop hook `pnpm check:fast`.
pre-commit:
  parallel: true
  jobs:
    - name: branch
      # Never commit to dev or main: they change only through PRs (main only through the release-prepare PR).
      run: case "$(git branch --show-current)" in dev|main) echo "Never commit to dev or main; commit on a branch cut from dev." >&2; exit 1;; esac
    - name: secrets
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose
    - name: prettier
      glob: "*.{ts,tsx,mjs,js,json,md,yml,yaml,css}"
      run: pnpm exec prettier --check {staged_files}
    - name: eslint
      glob: "*.{ts,tsx,mjs,js}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
