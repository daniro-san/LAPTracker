# Uptime check (#521): every 6 h, GET pages that read the database. A failed run makes GitHub email the
# owner, as for any failed scheduled run. Runs at :10 after the D141 heartbeat ticks (00/06/12/18 UTC),
# while the database is already awake, so it adds no Neon compute. Two tries a minute apart before failing.
name: uptime

on:
  schedule:
    - cron: "10 0,6,12,18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the pages
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          check() {
            failed=0
            for path in / /alliances /w/request; do
              code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" "$APP_URL$path") || code=000
              echo "$path -> HTTP $code"
              case "$code" in 2??) ;; *) failed=1 ;; esac
            done
            return $failed
          }
          check && exit 0
          echo "Retrying in 60 s"
          sleep 60
          check
