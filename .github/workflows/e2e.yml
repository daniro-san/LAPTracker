# The e2e suite (issue 477, D150): a production build against a Postgres service container, with the
# invented seed of e2e/fixtures/seed.ts. Actions pinned to commit SHAs; the tag is in the comment. Runs once per
# PR that changes what the app runs (Actions minutes, 2026-11-19), and by hand. Needs no secret: the server
# points every outside service at 127.0.0.1:9 and the suite fails if anything leaves the runner.
name: e2e

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "config/**"
      - "drizzle/**"
      - "e2e/**"
      - "public/**"
      - "scripts/db-local*.mjs"
      - "proxy.ts"
      - "instrumentation.ts"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: lap
          POSTGRES_PASSWORD: lap
          # The Neon driver sends a cleartext password (pipelineConnect), as the db:local cluster allows (D47).
          POSTGRES_HOST_AUTH_METHOD: password
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U lap"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://lap:lap@127.0.0.1:54320/lap_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 — version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The browser comes from the cache when it holds this version; its system libraries come from apt every run.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # The runner image's client; global setup drops, creates and seeds the database with it.
      - run: psql --version
      # Its own step, so the build's time shows apart and does not count against the web server's timeout.
      - run: pnpm exec next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm test:e2e
        env:
          E2E_NO_BUILD: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
