# The scheduler (plan §3.1): one curl every 15 minutes. All logic lives in /api/tick; no times here.
# Manual run: phase "tick" calls /api/tick, "before" / "after" call /api/snapshot directly.
name: tick

on:
  schedule:
    # Every 15 minutes, off the :00/:15/:30/:45 marks: GitHub delays or drops schedule events at peak minutes (D26).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: tick, or run a snapshot phase now
        type: choice
        options: [tick, before, after]
        default: tick

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    # The tick (up to 150 s), then up to 4 squads batches of up to 150 s each (D117).
    timeout-minutes: 14
    steps:
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PHASE: ${{ inputs.phase || 'tick' }}
        run: |
          if [ "$PHASE" = "tick" ]; then
            path="/api/tick"
          else
            path="/api/snapshot?phase=$PHASE"
          fi
          code=$(curl -sS --max-time 150 -X POST -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL$path") || { echo "$path -> curl failed"; exit 1; }
          echo "$path -> HTTP $code"
          case "$code" in 2??) ;; *) exit 1 ;; esac
      # The nightly squads read (D117): the app decides whether a batch is due (204 when not); each 200
      # is one batch, so call again while batches remain, at most 4 times.
      - name: Squads read
        if: ${{ (inputs.phase || 'tick') == 'tick' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for i in 1 2 3 4; do
            code=$(curl -sS --max-time 150 -X POST -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/squads-read") || { echo "squads-read -> curl failed"; exit 1; }
            echo "/api/squads-read -> HTTP $code"
            case "$code" in 200) ;; 2??) break ;; *) exit 1 ;; esac
          done
