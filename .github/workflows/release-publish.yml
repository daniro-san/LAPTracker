# Step 2 of a release: after the owner merges the release PR, tag the merge commit and publish the GitHub Release (D29).
# Runs on every push to main; does nothing unless the commit message holds `release: vX.Y.Z` at the start of a line
# (the merge commit's title is the PR title, so it is the first line). Vercel deploys main on its own: no deploy logic here.
name: release-publish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: "contains(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          version=$(printf '%s\n' "$MESSAGE" | grep -m 1 -oE '^release: v[0-9]+\.[0-9]+\.[0-9]+' | cut -d' ' -f2 || true)
          if [ -z "$version" ]; then
            echo "Not a release commit. Nothing to do."
            exit 0
          fi

          if out=$(gh api "repos/$GH_REPO/git/ref/tags/$version" 2>&1); then
            echo "Tag $version already exists. Nothing to do."
            exit 0
          elif [[ "$out" != *"Not Found"* ]]; then
            echo "::error::Could not look up tag $version: $out"
            exit 1
          fi

          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
          echo "Published $version at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
