# Gates every PR (plan §11.4, §12.4). Actions pinned to commit SHAs; the tag is in the comment.
# Runs once per PR, not also on the branch push (2026-11-19, to measure Actions minutes before deciding on a
# private repo). A PR that changes only docs (docs/** or *.md) checks formatting and skips the rest; the job
# still reports "check", which the dev and main rulesets require.
# PRs into dev and the release PR into main run here. The release PR needs its own pull_request run: a
# "check" from a Run workflow on the same commit does not count toward a PR's required checks (verified on the
# v5.46.0 release PR, 2026-11-22, D29). Prepare release no longer starts a Run workflow of ci, so a release
# still runs ci once.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docs-only change?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE"
          files=$(git diff --no-renames --name-only "$BASE" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -Ev '^docs/|\.md$' >/dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 — version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The newest prettier, eslint and tsc caches saved from a Run workflow for this lockfile. Content-hashed
      # (--cache-strategy content; tsc hashes every file in its build info), so a fresh checkout's mtimes
      # do not matter and a changed file is checked again.
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Format check (docs-only PR)
        if: steps.scope.outputs.docs_only == 'true'
        run: pnpm exec prettier --check .
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm check
      # Saved only from a Run workflow (a trusted ref), never from a PR, so a PR cannot plant a cache that
      # later runs restore.
      - if: steps.scope.outputs.docs_only != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm audit --audit-level high
