# Step 1 of a release: opens the PR `dev` -> `main` titled `release: vX.Y.Z` with generated notes (D29).
# Run it from Actions -> Prepare release. It never pushes and never merges; the owner merges (merge commit).
# The version comes from the latest `v*` tag, not from package.json.
name: release-prepare

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write # generate-notes is a POST and needs it; nothing here pushes, tags or releases
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          open=$(gh pr list --base main --head dev --state open --json url --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            echo "::error::A release PR is already open: $open. Merge or close it first."
            exit 1
          fi

          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "::error::dev has no commits beyond main. Nothing to release."
            exit 1
          fi

          latest=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z tag found. Create the first release by hand."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac

          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$next" -f target_commitish=dev -f previous_tag_name="$latest" \
            --jq .body > notes.md

          url=$(gh pr create --base main --head dev --title "release: $next" --body-file notes.md)
          echo "Opened $url ($latest -> $next, $ahead commits)."
          echo "Opened $url ($latest -> $next, $ahead commits)." >> "$GITHUB_STEP_SUMMARY"
